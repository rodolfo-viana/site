  <style>
  body {
    --primary-color: #476aa1;
    --primary-pale-color: #476aa133;
    --primary-decoration-color: #476aa112;
    --bg-color: #ffffff;
    --text-color: #2f3030;
    --text-pale-color: #717171;
    --text-decoration-color: #a9a9a9;
    --highlight-mark-color: #5f75b020;
    --callout-note-color: #476aa1;
    --callout-tip-color: #268556;
    --callout-important-color: #885fc9;
    --callout-warning-color: #ab6632;
    --callout-caution-color: #c64e4e;
  }

  body.dark {
    --primary-color: #7e9bd6;
    --primary-pale-color: #7e9bd666;
    --primary-decoration-color: #7e9bd612;
    --bg-color: #1c1c1c;
    --text-color: #c8c8c8;
    --text-pale-color: #8d8d8d;
    --text-decoration-color: #5f5f5f;
    --highlight-mark-color: #8296cb3b;
    --callout-note-color: #7e9bd6;
    --callout-tip-color: #47976f;
    --callout-important-color: #9776cd;
    --callout-warning-color: #ad7a52;
    --callout-caution-color: #d06161;
  }

  body {
    --main-font: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --code-font: "JetBrains Mono", ui-monospace, monospace;
    --homepage-max-width: 768px;
    --main-max-width: 768px;
    --avatar-size: 60px;
    --font-size: 16px;
    --line-height: 1.75;
    --img-border-radius: 0;
    --detail-border-radius: 0;
    --dark-mode-img-brightness: 0.82;
    --dark-mode-chart-brightness: 0.82;
    --inline-code-border-radius: 2px;
    --inline-code-bg-color: var(--primary-decoration-color);
    --block-code-border-radius: 0;
    --block-code-border-color: var(--primary-color);
    --detail-border-color: var(--primary-color);
  }

  header nav {
    display: flex;
    justify-content: space-between;
  }

  header .lang-switch {
    padding-right: 0;
  }

  .d3js {
    box-sizing: border-box;
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    background: var(--bg-color);
    font-family: var(--main-font);
  }

  .d3js svg {
    display: block;
    width: 100%;
    height: auto;
    font-family: inherit;
  }

  .prose video {
    box-sizing: border-box;
    display: block;
    width: 100%;
    height: auto;
    border: 1.5px solid var(--primary-color);
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  body.articles .article-list {
    padding: 0 15px;
  }

  body.articles .article-entry {
    padding: 0.75em 0;
    border-bottom: 1px solid var(--primary-decoration-color);
  }

  body.articles .article-entry:last-of-type {
    border-bottom: 0;
  }

  body.articles .article-title {
    line-height: 1.5;
  }

  body.articles .article-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1.25em;
  }

  body.articles .article-authors {
    margin-top: 0.15em;
    color: var(--text-pale-color);
    font-size: 0.85em;
    line-height: 1.5;
  }

  body.articles .article-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.15em 0.45em;
    color: var(--text-pale-color);
    font-size: 0.85em;
    line-height: 1.5;
  }

  body.articles .article-meta cite {
    font-style: normal;
  }

  body.articles .article-meta time {
    white-space: nowrap;
  }

  body.articles .article-actions {
    display: flex;
    flex-shrink: 0;
    gap: 0.25em;
  }

  body.articles .article-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    padding: 7px;
    border: 0;
    color: var(--primary-color);
    background: transparent;
    text-decoration: none;
    cursor: pointer;
  }

  body.articles .article-action:hover,
  body.articles .article-action.copied {
    background: var(--primary-decoration-color);
  }

  body.articles .article-action span,
  body.articles .article-action svg {
    display: block;
    width: 18px;
    height: 18px;
  }

  body.articles .article-action .check-icon {
    display: none;
  }

  body.articles .article-action.copied .copy-icon {
    display: none;
  }

  body.articles .article-action.copied .check-icon {
    display: block;
  }

  @media (max-width: 425px) {
    body.articles .article-entry {
      padding: 1em 0;
    }

    body.articles .article-heading {
      gap: 0.5em;
    }
  }
</style>

  <script>
    const theme = sessionStorage.getItem('theme');
    const match = window.matchMedia("(prefers-color-scheme: dark)").matches;
    if ((theme && theme == 'dark') || (!theme && match)) {
      document.body.classList.add('dark');
      const hl = document.querySelector('link#hl');
      if (hl) hl.href = 'https://rodolfoviana.com.br/giallo-dark.css';
    }
  </script>
  
  
<div class="wrapper">
