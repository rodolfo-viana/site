{% if clickable | default(value=false) %}
<details {% if not hidden | default(value=false) %}open{% endif %}>
  <summary><span>{{ header | default(value="Nota") }}</span></summary>
  {{ body | markdown | safe }}
</details>
{% else %}
<blockquote class="callout note {% if header %}has-title{% else %}no-title{% endif %}">
  {% if header %}<p class="title"><strong>{{ header }}</strong></p>{% endif %}
  <div class="content">{{ body | markdown | safe }}</div>
</blockquote>
{% endif %}
