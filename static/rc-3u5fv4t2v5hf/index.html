<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Revisão clínica</title>
<style>
:root {
  --bg: #f7f7f5; --card: #ffffff; --ink: #1d2733; --muted: #5d6b78; --line: #dde2e6;
  --accent: #1f6f8b; --accent-ink: #ffffff; --soft: #e8f1f5; --ok: #2e7d4f; --warn: #a15c00;
  --chip: #f0f2f4; --chip-on: #1f6f8b; --chip-on-ink: #ffffff; --excerpt: #f4f6f8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12171c; --card: #1a2128; --ink: #e6ebef; --muted: #9aa7b3; --line: #2c3640;
    --accent: #5bb3d0; --accent-ink: #0d1418; --soft: #1d2f38; --ok: #6cc28f; --warn: #e0a64f;
    --chip: #232c35; --chip-on: #5bb3d0; --chip-on-ink: #0d1418; --excerpt: #20282f;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 16px 16px 80px; }
h1 { font-size: 1.45rem; line-height: 1.25; margin: 8px 0 4px; }
h2 { font-size: 1.2rem; margin: 0 0 4px; }
h3 { font-size: 1.02rem; margin: 0; }
p { margin: 8px 0; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 14px 0; }
.gate { max-width: 460px; margin: 12vh auto 0; }
input[type=text], input[type=password], textarea, select {
  width: 100%; font: inherit; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
textarea { min-height: 76px; resize: vertical; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
  background: var(--chip); color: var(--ink); padding: 9px 14px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .55; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.sticky { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 10px;
  border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.tab { white-space: nowrap; padding: 7px 12px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); font-size: .92rem; }
.tab.on { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.bar { height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.bar > span { display: block; height: 100%; background: var(--ok); width: 0; }
.q { margin: 14px 0 0; }
.q > .label { font-weight: 600; margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips span { display: inline-block; padding: 8px 14px; border-radius: 999px; background: var(--chip);
  border: 1px solid var(--line); user-select: none; min-width: 44px; text-align: center; }
.chips input:checked + span { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.chips input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.figure { margin: 10px -4px 0; }
.figure img { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); background: #000; display: block; cursor: zoom-in; }
.placeholder { aspect-ratio: 1754 / 1241; border-radius: 8px; border: 1px dashed var(--line);
  display: flex; align-items: center; justify-content: center; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 4px 14px; margin-top: 8px; font-size: .93rem; }
.excerpt { background: var(--excerpt); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 12px; margin: 10px 0; font-family: Georgia, "Times New Roman", serif; font-size: .98rem; }
.where { font-size: .82rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.status { font-size: .9rem; }
.status.ok { color: var(--ok); }
.status.warn { color: var(--warn); }
.badge { display: inline-block; font-size: .78rem; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--accent); margin-left: 6px; vertical-align: 2px; }
.overlay { position: fixed; inset: 0; background: #000; z-index: 20; overflow: auto; display: none; }
.overlay.on { display: block; }
.overlay img { display: block; margin: 56px auto 24px; max-width: none; width: 100%; }
.overlay.big img { width: 1754px; }
.overlay .tools { position: fixed; top: 10px; right: 10px; display: flex; gap: 8px; }
.overlay .tools button { background: #fff; color: #111; border: none; }
details summary { cursor: pointer; color: var(--accent); }
.hidden { display: none !important; }
.err { color: #b3261e; }
footer { margin-top: 24px; }
</style>
</head>
<body>
<main>
  <section id="gate" class="card gate">
    <h1>Revisão clínica</h1>
    <p class="muted">Página privada. Digite o código de acesso que você recebeu, ou abra o link completo enviado por Rodolfo.</p>
    <form id="gateForm" class="q">
      <input id="code" type="password" autocomplete="off" placeholder="Código de acesso" aria-label="Código de acesso">
      <div class="row" style="margin-top:10px">
        <label class="small"><input id="remember" type="checkbox" checked> lembrar neste aparelho</label>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="primary" type="submit" id="gateBtn">Abrir</button>
        <span id="gateMsg" class="small muted"></span>
      </div>
    </form>
  </section>

  <section id="app" class="hidden">
    <div id="who" class="card hidden">
      <h2>Quem está respondendo?</h2>
      <div class="chips" id="whoChips" role="radiogroup" aria-label="Revisor"></div>
    </div>
    <div id="intro"></div>
    <div class="sticky">
      <div class="row" style="justify-content:space-between">
        <strong id="whoLabel"></strong>
        <span class="small muted" id="overall"></span>
      </div>
      <div class="bar"><span id="overallBar"></span></div>
      <div class="tabs" id="tabs" style="margin-top:10px"></div>
    </div>
    <div id="parts"></div>
    <footer class="card small">
      <p><strong>Cópia de segurança.</strong> Se o envio falhar, baixe suas respostas e mande o arquivo para Rodolfo.</p>
      <div class="row">
        <button type="button" id="csvBtn">Baixar minhas respostas (CSV)</button>
        <button type="button" id="retryBtn">Reenviar pendentes</button>
        <button type="button" id="forgetBtn">Esquecer o código neste aparelho</button>
      </div>
      <p class="muted" id="version"></p>
    </footer>
  </section>
</main>

<div class="overlay" id="overlay" role="dialog" aria-label="Imagem ampliada">
  <div class="tools"><button type="button" id="zoomBtn">Ampliar</button><button type="button" id="closeBtn">Fechar</button></div>
  <img id="overlayImg" alt="">
</div>

<script>
"use strict";
const SALT = "LZsN1Uhw8jjl3oKK1vpZ1Q==";
const ITERATIONS = 600000;
const VERSION = "2026-11-22 19:45 UTC";
const STORE = "rc:rc-3u5fv4t2v5hf";

const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const normalize = (s) => s.toUpperCase().replace(/[^A-Z0-9]/g, "");
const store = {
  get(k, d) { try { const v = localStorage.getItem(STORE + ":" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(STORE + ":" + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  del(k) { try { localStorage.removeItem(STORE + ":" + k); } catch (e) { /* storage unavailable */ } },
};

let KEY = null, P = null, WHO = null, answers = {}, status = {};
const imageCache = new Map();

async function deriveKey(code) {
  const base = await crypto.subtle.importKey("raw", enc.encode(normalize(code)), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: fromB64(SALT), iterations: ITERATIONS, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function fetchBytes(path) {
  const r = await fetch(path, { cache: "no-cache" });
  if (!r.ok) throw new Error("arquivo " + path + ": " + r.status);
  return new Uint8Array(await r.arrayBuffer());
}
async function decrypt(bytes) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12) }, KEY, bytes.slice(12));
  return new Uint8Array(plain);
}

async function openPage(code, remember) {
  $("gateMsg").textContent = "Abrindo…";
  $("gateBtn").disabled = true;
  try {
    KEY = await deriveKey(code);
    const raw = await decrypt(await fetchBytes("d.bin"));
    P = JSON.parse(new TextDecoder().decode(raw));
  } catch (e) {
    KEY = null;
    $("gateBtn").disabled = false;
    $("gateMsg").innerHTML = '<span class="err">Código incorreto ou página indisponível.</span>';
    return false;
  }
  if (remember) store.set("code", normalize(code)); else store.del("code");
  $("gate").classList.add("hidden");
  $("app").classList.remove("hidden");
  start();
  return true;
}

function params() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  return { code: h.get("k"), who: h.get("r") };
}

function start() {
  const p = params();
  if (p.who && P.revisores.some((r) => r.id === p.who)) store.set("who", p.who);
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  $("version").textContent = "Versão " + VERSION + ".";
  $("intro").innerHTML = P.introducao;
  const chips = $("whoChips");
  P.revisores.filter((r) => !r.oculto).forEach((r) => {
    const l = document.createElement("label");
    l.innerHTML = '<input type="radio" name="who" value="' + r.id + '"><span>' + esc(r.nome) + "</span>";
    l.querySelector("input").addEventListener("change", () => setWho(r.id));
    chips.appendChild(l);
  });
  const saved = store.get("who", null);
  if (saved) setWho(saved); else $("who").classList.remove("hidden");
  window.addEventListener("online", retryPending);
}

function setWho(id) {
  WHO = id;
  store.set("who", id);
  const r = P.revisores.find((x) => x.id === id);
  $("whoLabel").innerHTML = "Respondendo como " + esc(r.nome) + ' <button type="button" class="small" id="changeWho" style="padding:3px 10px;margin-left:6px">trocar</button>';
  $("changeWho").addEventListener("click", () => { $("who").classList.remove("hidden"); window.scrollTo(0, 0); });
  document.querySelectorAll('input[name=who]').forEach((i) => { i.checked = i.value === id; });
  $("who").classList.add("hidden");
  answers = store.get("answers:" + id, {});
  status = store.get("status:" + id, {});
  render();
  retryPending();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render() {
  const tabs = $("tabs"), parts = $("parts");
  tabs.innerHTML = ""; parts.innerHTML = "";
  P.partes.forEach((part, idx) => {
    const t = document.createElement("button");
    t.type = "button"; t.className = "tab"; t.dataset.part = part.id;
    t.addEventListener("click", () => document.getElementById("part-" + part.id).scrollIntoView({ behavior: "smooth" }));
    tabs.appendChild(t);
    const sec = document.createElement("section");
    sec.id = "part-" + part.id;
    sec.innerHTML = '<div class="card" style="background:var(--soft)"><h2>' + esc(part.titulo) + "</h2><p>" + part.descricao + "</p></div>";
    part.itens.forEach((item) => sec.appendChild(item.tipo === "caso" ? caseCard(item) : textCard(item)));
    parts.appendChild(sec);
  });
  updateProgress();
  observeImages();
}

function chipGroup(name, options, value, onChange) {
  const box = document.createElement("div");
  box.className = "chips"; box.setAttribute("role", "radiogroup");
  options.forEach((opt) => {
    const l = document.createElement("label");
    const id = name + ":" + opt;
    l.innerHTML = '<input type="radio" name="' + esc(name) + '"><span>' + esc(opt) + "</span>";
    const input = l.querySelector("input");
    input.value = opt; input.checked = value === opt;
    input.addEventListener("change", () => onChange(opt));
    box.appendChild(l);
  });
  return box;
}

function question(label, control) {
  const q = document.createElement("div");
  q.className = "q";
  q.innerHTML = '<div class="label">' + esc(label) + "</div>";
  q.appendChild(control);
  return q;
}

function textArea(value, placeholder, onInput) {
  const t = document.createElement("textarea");
  t.value = value || ""; t.placeholder = placeholder;
  t.addEventListener("input", () => onInput(t.value));
  return t;
}

function saveLocal(key, field, value) {
  answers[key] = answers[key] || {};
  answers[key][field] = value;
  store.set("answers:" + WHO, answers);
  if (status[key] && status[key].estado !== "pendente") {
    status[key] = { estado: "alterado", quando: status[key].quando };
    store.set("status:" + WHO, status);
    showStatus(key);
  }
}

function caseCard(item) {
  const key = item.id, a = answers[key] || {};
  const card = document.createElement("article");
  card.className = "card"; card.id = "item-" + key;
  const extra = item.pagina > 1 ? '<span class="badge">página ' + item.pagina + " deste caso</span>" : "";
  card.innerHTML =
    '<div class="row" style="justify-content:space-between"><h3>Caso ' + esc(item.caso) + " · Programa " + esc(item.programa) + extra + "</h3>" +
    '<span class="status small" id="st-' + key + '"></span></div>' +
    '<p class="small muted" style="margin:4px 0 0">' + esc(item.motivo) + "</p>" +
    '<div class="figure"><div class="placeholder small" data-img="' + esc(item.imagem) + '">Carregando imagem…</div></div>' +
    '<p class="small muted" style="margin:6px 0 0">Toque na imagem para ampliar. Amarelo: referência fornecida com o banco. Azul: contorno automático.</p>' +
    '<div class="facts">' +
    "<div>Banco: <strong>" + esc(item.banco) + "</strong></div>" +
    "<div>Categoria: <strong>" + esc(item.categoria) + "</strong></div>" +
    "<div>FE de referência: <strong>" + esc(item.fe_referencia) + "</strong></div>" +
    "<div>FE do programa " + esc(item.programa) + ": <strong>" + esc(item.fe_programa) + "</strong> (" + esc(item.diferenca) + ")</div>" +
    "</div>";
  const yn = ["Sim", "Não", "Incerto"];
  if (item.perguntas_referencia) {
    P.perguntas_caso.referencia.forEach((q) =>
      card.appendChild(question(q.texto, chipGroup(key + ":" + q.id, q.opcoes || yn, a[q.id], (v) => saveLocal(key, q.id, v)))));
  } else {
    const n = document.createElement("p");
    n.className = "small muted q";
    n.textContent = "As perguntas sobre o contorno de referência e as fases deste exame ficam na página 1 deste caso.";
    card.appendChild(n);
  }
  P.perguntas_caso.automatico.forEach((q) =>
    card.appendChild(question(q.texto, chipGroup(key + ":" + q.id, q.opcoes || yn, a[q.id], (v) => saveLocal(key, q.id, v)))));
  card.appendChild(question("Comentário (opcional)", textArea(a.comentario, "Escreva aqui o que quiser acrescentar, ou o que falta na imagem.", (v) => saveLocal(key, "comentario", v))));
  card.appendChild(sendRow(key, () => caseRows(item)));
  setTimeout(() => showStatus(key), 0);
  return card;
}

function textCard(item) {
  const card = document.createElement("article");
  card.className = "card"; card.id = "item-" + item.id;
  card.innerHTML =
    '<div class="row" style="justify-content:space-between"><span class="where">' + esc(item.local) + "</span>" +
    '<span class="status small" id="st-' + item.id + '"></span></div>' +
    (item.contexto ? "<p>" + esc(item.contexto) + "</p>" : "") +
    '<div class="excerpt">' + item.trecho + "</div>";
  item.perguntas.forEach((q, i) => {
    const key = q.id, a = answers[key] || {};
    const box = document.createElement("div");
    box.className = "q";
    if (i > 0) box.style.borderTop = "1px solid var(--line)";
    if (i > 0) box.style.paddingTop = "10px";
    box.appendChild(question(q.texto, chipGroup(key + ":avaliacao", P.opcoes_texto, a.avaliacao, (v) => saveText(item.id, key, "avaliacao", v))));
    box.appendChild(question("Correção ou sugestão (opcional)", textArea(a.sugestao, "Escreva como deveria ficar, ou o que falta.", (v) => saveText(item.id, key, "sugestao", v))));
    if (q.pede_referencia) {
      box.appendChild(question("Referência de apoio (opcional)", textArea(a.referencia, "Autor, ano, revista ou link.", (v) => saveText(item.id, key, "referencia", v))));
    }
    card.appendChild(box);
  });
  card.appendChild(sendRow(item.id, () => textRows(item)));
  setTimeout(() => showStatus(item.id), 0);
  return card;
}

function saveText(blockId, key, field, value) {
  answers[key] = answers[key] || {};
  answers[key][field] = value;
  store.set("answers:" + WHO, answers);
  if (status[blockId] && status[blockId].estado !== "pendente") {
    status[blockId] = { estado: "alterado", quando: status[blockId].quando };
    store.set("status:" + WHO, status);
    showStatus(blockId);
  }
}

function sendRow(key, rowsFn) {
  const row = document.createElement("div");
  row.className = "row q";
  const b = document.createElement("button");
  b.type = "button"; b.className = "primary"; b.textContent = "Enviar";
  b.addEventListener("click", async () => {
    b.disabled = true;
    await submit(key, rowsFn());
    b.disabled = false;
  });
  row.appendChild(b);
  const hint = document.createElement("span");
  hint.className = "small muted";
  hint.textContent = "Pode enviar mesmo sem responder tudo; um novo envio substitui o anterior.";
  row.appendChild(hint);
  return row;
}

function caseRows(item) {
  const a = answers[item.id] || {};
  const linha = { revisor: WHO, caso: item.caso, pagina: item.pagina, programa: item.programa, grupo: item.grupo, versao: VERSION, comentario: a.comentario || "" };
  [...P.perguntas_caso.referencia, ...P.perguntas_caso.automatico].forEach((q) => { linha[q.coluna] = a[q.id] || ""; });
  return [{ tipo: "casos", linha }];
}

function textRows(item) {
  return item.perguntas.map((q) => {
    const a = answers[q.id] || {};
    return { tipo: "texto", linha: { revisor: WHO, pergunta: q.id, trecho: item.local, avaliacao: a.avaliacao || "", sugestao: a.sugestao || "", referencia: a.referencia || "", versao: VERSION } };
  });
}

async function post(body, cors) {
  const opts = { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) };
  if (!cors) opts.mode = "no-cors";
  const r = await fetch(P.envio.url, opts);
  if (!cors) return "sem-confirmacao";
  const j = await r.json();
  if (!j.ok) throw Object.assign(new Error(j.erro || "recusado"), { server: true });
  return "confirmado";
}

async function submit(key, rows) {
  const envio = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const stamp = new Date().toISOString();
  rows.forEach((r) => { r.linha.enviado_em = stamp; r.linha.envio_id = envio; });
  if (!P.envio.url) {
    status[key] = { estado: "pendente", quando: stamp, linhas: rows };
    store.set("status:" + WHO, status); showStatus(key); updateProgress();
    return;
  }
  let result = "confirmado";
  try {
    for (const r of rows) {
      let got;
      try { got = await post({ token: P.envio.token, tipo: r.tipo, linha: r.linha }, true); }
      catch (e) {
        if (e.server) throw e;
        got = await post({ token: P.envio.token, tipo: r.tipo, linha: r.linha }, false);
      }
      if (got !== "confirmado") result = got;
    }
    status[key] = { estado: result === "confirmado" ? "enviado" : "enviado?", quando: stamp };
  } catch (e) {
    status[key] = { estado: "pendente", quando: stamp, linhas: rows, erro: String(e.message || e) };
  }
  store.set("status:" + WHO, status);
  showStatus(key); updateProgress();
}

async function retryPending() {
  if (!P || !P.envio.url || !WHO) return;
  for (const [key, s] of Object.entries(status)) {
    if (s.estado === "pendente" && s.linhas) await submit(key, s.linhas);
  }
}

function showStatus(key) {
  const el = document.getElementById("st-" + key);
  if (!el) return;
  const s = status[key];
  const time = (iso) => new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  el.className = "status small";
  if (!s) { el.textContent = ""; return; }
  if (s.estado === "enviado") { el.classList.add("ok"); el.textContent = "✓ enviado " + time(s.quando); }
  else if (s.estado === "enviado?") { el.classList.add("ok"); el.textContent = "✓ enviado " + time(s.quando) + " (sem confirmação)"; }
  else if (s.estado === "alterado") { el.classList.add("warn"); el.textContent = "alterado depois do envio: envie de novo"; }
  else { el.classList.add("warn"); el.textContent = P.envio.url ? "salvo neste aparelho; envio pendente" : "salvo neste aparelho (envio ainda não ligado)"; }
}

function updateProgress() {
  let total = 0, done = 0;
  P.partes.forEach((part) => {
    let pt = 0, pd = 0;
    part.itens.forEach((item) => {
      pt += 1;
      const s = status[item.id];
      if (s && (s.estado === "enviado" || s.estado === "enviado?")) pd += 1;
    });
    total += pt; done += pd;
    const tab = document.querySelector('.tab[data-part="' + part.id + '"]');
    if (tab) { tab.textContent = part.curto + " · " + pd + "/" + pt; tab.classList.toggle("on", pd === pt); }
  });
  $("overall").textContent = done + " de " + total + " itens enviados";
  $("overallBar").style.width = (total ? (100 * done / total) : 0) + "%";
}

function observeImages() {
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) { io.unobserve(en.target); loadImage(en.target); } });
  }, { rootMargin: "600px 0px" });
  document.querySelectorAll("[data-img]").forEach((el) => io.observe(el));
}

async function imageUrl(path) {
  if (imageCache.has(path)) return imageCache.get(path);
  const bytes = await decrypt(await fetchBytes(path));
  const url = URL.createObjectURL(new Blob([bytes], { type: "image/jpeg" }));
  imageCache.set(path, url);
  return url;
}

async function loadImage(el) {
  try {
    const url = await imageUrl(el.dataset.img);
    const img = document.createElement("img");
    img.src = url; img.alt = "Cortes do exame, fim da diástole e fim da sístole";
    img.addEventListener("click", () => { $("overlayImg").src = url; $("overlay").classList.add("on"); });
    el.replaceWith(img);
  } catch (e) {
    el.textContent = "Não foi possível carregar a imagem. Recarregue a página.";
  }
}

function toCsv() {
  const cols = ["tipo", "revisor", "item", "campo", "valor"];
  const out = [cols.join(";")];
  for (const [item, fields] of Object.entries(answers)) {
    for (const [campo, valor] of Object.entries(fields)) {
      out.push(["resposta", WHO, item, campo, valor].map((v) => '"' + String(v ?? "").replace(/"/g, '""') + '"').join(";"));
    }
  }
  return "﻿" + out.join("\r\n");
}

$("gateForm").addEventListener("submit", (e) => { e.preventDefault(); openPage($("code").value, $("remember").checked); });
$("csvBtn").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([toCsv()], { type: "text/csv;charset=utf-8" }));
  a.download = "respostas_" + (WHO || "revisor") + ".csv";
  a.click();
});
$("retryBtn").addEventListener("click", retryPending);
window.addEventListener("hashchange", () => { if (params().code) location.reload(); });
$("forgetBtn").addEventListener("click", () => { store.del("code"); alert("Código esquecido neste aparelho. As respostas salvas continuam aqui."); });
$("closeBtn").addEventListener("click", () => { $("overlay").classList.remove("on", "big"); $("zoomBtn").textContent = "Ampliar"; });
$("zoomBtn").addEventListener("click", () => { const o = $("overlay"); o.classList.toggle("big"); $("zoomBtn").textContent = o.classList.contains("big") ? "Ajustar" : "Ampliar"; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("closeBtn").click(); });

(async () => {
  if (!window.crypto || !crypto.subtle) {
    $("gateMsg").innerHTML = '<span class="err">Este navegador não abre a página. Use Chrome, Safari ou Firefox atualizados.</span>';
    return;
  }
  const p = params();
  const code = p.code || store.get("code", null);
  if (code) await openPage(code, true);
})();
</script>
